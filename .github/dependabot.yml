version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      # .NET's monthly patches arrive together, so they come as one pull request.
      dotnet:
        patterns:
          - "Microsoft.*"
          - "System.*"
    ignore:
      # NET-13: stay on .NET 10 LTS. The move to the next LTS is its own pull request.
      - dependency-name: "Microsoft.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Serilog.Extensions.Hosting"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
